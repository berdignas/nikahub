  <circle cx="98" cy="88" r="2.5" fill="url(#goldStem)" />
  <circle cx="104" cy="85" r="2" fill="url(#goldStem)" />
  <circle cx="94" cy="93" r="1.8" fill="url(#goldStem)" />
