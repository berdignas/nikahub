  {/* Rose Center & Swirls */}
  <path d="M100 80 C85 60, 60 75, 75 95 C90 115, 120 115, 125 95 C130 75, 115 60, 100 80 Z" fill="url(#rosePetal1)" stroke="#b57970" stroke-width="0.75" />
  <path d="M85 70 C70 50, 45 70, 60 90 C75 110, 105 125, 120 105 C135 85, 100 50, 85 70 Z" fill="url(#rosePetal2)" fill-opacity="0.85" stroke="#a3635a" stroke-width="0.75" />
  <path d="M115 65 C135 50, 155 70, 140 95 C125 120, 95 130, 80 115 C65 100, 95 50, 115 65 Z" fill="url(#rosePetal1)" stroke="#b57970" stroke-width="0.75" />
