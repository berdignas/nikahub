  <path d="M60 85 C35 80, 30 115, 55 130 C80 145, 110 140, 135 130 C160 120, 165 85, 140 75 C115 65, 85 90, 60 85 Z" fill="url(#rosePetal2)" fill-opacity="0.7" stroke="#b57970" stroke-width="0.5" />
  <path d="M75 120 C60 145, 100 165, 125 150 C150 135, 155 115, 145 105" fill="none" stroke="#a3635a" stroke-width="0.8" />
