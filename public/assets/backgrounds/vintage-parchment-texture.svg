<svg viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <filter id="parchmentNoise">
    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.96  0 0 0 0 0.94  0 0 0 0 0.89  0 0 0 0.25 0" in="noise" result="coloredNoise"/>
    <feComposite in2="SourceGraphic" in="coloredNoise" operator="in"/>
  </filter>
  <rect width="400" height="400" fill="#faf7f2"/>
  <rect width="400" height="400" filter="url(#parchmentNoise)"/>
  {/* Subtle vintage botanical border imprint */}
  <rect x="15" y="15" width="370" height="370" stroke="#c9a86a" stroke-opacity="0.25" stroke-width="1" fill="none"/>
  <rect x="22" y="22" width="356" height="356" stroke="#c9a86a" stroke-opacity="0.15" stroke-dasharray="4 4" fill="none"/>
</svg>
